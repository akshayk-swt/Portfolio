<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#080808"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#151515"/>
  <circle cx="30" cy="25" r="6" fill="#FF2B35"/>
  <circle cx="50" cy="25" r="6" fill="#707070"/>
  <circle cx="70" cy="25" r="6" fill="#292929"/>
  <text x="400" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FF2B35" text-anchor="middle">GAMEMATES — Multiplayer Gaming Room</text>

  <!-- Left: Game Room & Players -->
  <rect x="30" y="70" width="350" height="400" rx="12" fill="#101010" stroke="#E50914" stroke-width="1.5"/>
  <text x="50" y="105" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Imposter Drawing Lobby</text>
  <text x="50" y="130" font-family="sans-serif" font-size="12" fill="#A3A3A3">Room Code: #GM-8802 • Host Active</text>

  <!-- Player Avatars -->
  <rect x="50" y="160" width="310" height="50" rx="8" fill="#151515" stroke="#292929"/>
  <circle cx="80" cy="185" r="14" fill="#E50914"/>
  <text x="110" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Player 1 (Host)</text>
  <text x="320" y="190" font-family="sans-serif" font-size="12" fill="#FF2B35">READY ✓</text>

  <rect x="50" y="220" width="310" height="50" rx="8" fill="#151515" stroke="#292929"/>
  <circle cx="80" cy="245" r="14" fill="#707070"/>
  <text x="110" y="250" font-family="sans-serif" font-size="14" fill="#FFFFFF">Player 2</text>
  <text x="320" y="250" font-family="sans-serif" font-size="12" fill="#FF2B35">READY ✓</text>

  <!-- Right: Canvas & Scoreboard -->
  <rect x="410" y="70" width="360" height="240" rx="12" fill="#151515" stroke="#292929"/>
  <text x="430" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Drawing Canvas</text>
  <!-- Mock Canvas Drawing -->
  <path d="M 450 200 Q 520 120 590 190 T 730 180" stroke="#FF2B35" stroke-width="4" fill="none"/>
  
  <rect x="410" y="330" width="360" height="140" rx="12" fill="#151515" stroke="#292929"/>
  <text x="430" y="365" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Scoreboard</text>
  <text x="430" y="400" font-family="sans-serif" font-size="14" fill="#A3A3A3">1st Place: Player 1 (450 pts)</text>
  <text x="430" y="430" font-family="sans-serif" font-size="14" fill="#A3A3A3">2nd Place: Player 2 (380 pts)</text>
</svg>
