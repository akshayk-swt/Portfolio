<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#101010"/>
  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="50" fill="#151515"/>
  <circle cx="30" cy="25" r="6" fill="#FF2B35"/>
  <circle cx="50" cy="25" r="6" fill="#707070"/>
  <circle cx="70" cy="25" r="6" fill="#292929"/>
  <text x="400" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#A3A3A3" text-anchor="middle">TideBill — Invoice Management System [Tested ✓]</text>
  
  <!-- Sidebar -->
  <rect x="20" y="70" width="180" height="400" rx="12" fill="#151515" stroke="#292929"/>
  <rect x="40" y="100" width="140" height="12" rx="4" fill="#E50914"/>
  <rect x="40" y="130" width="120" height="8" rx="4" fill="#292929"/>
  <rect x="40" y="150" width="100" height="8" rx="4" fill="#292929"/>
  <rect x="40" y="170" width="130" height="8" rx="4" fill="#292929"/>
  
  <!-- Main Dashboard Content -->
  <rect x="220" y="70" width="560" height="120" rx="12" fill="#151515" stroke="#292929"/>
  <text x="240" y="105" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Invoice Overview</text>
  <text x="240" y="135" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FF2B35">$48,250.00</text>
  <text x="240" y="160" font-family="sans-serif" font-size="12" fill="#707070">24 Active Invoices • 0 Failed Payments (Verified QA)</text>

  <!-- Invoices Table Mockup -->
  <rect x="220" y="210" width="560" height="260" rx="12" fill="#151515" stroke="#292929"/>
  <line x1="220" y1="260" x2="780" y2="260" stroke="#292929"/>
  <text x="240" y="242" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A3A3A3">INVOICE ID</text>
  <text x="360" y="242" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A3A3A3">CLIENT</text>
  <text x="520" y="242" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A3A3A3">AMOUNT</text>
  <text x="660" y="242" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A3A3A3">STATUS</text>

  <!-- Row 1 -->
  <text x="240" y="295" font-family="sans-serif" font-size="14" fill="#FFFFFF">#INV-9021</text>
  <text x="360" y="295" font-family="sans-serif" font-size="14" fill="#A3A3A3">Acme Corp</text>
  <text x="520" y="295" font-family="sans-serif" font-size="14" fill="#FFFFFF">$4,500.00</text>
  <rect x="660" y="280" width="70" height="22" rx="11" fill="rgba(229, 9, 20, 0.2)" stroke="#E50914"/>
  <text x="695" y="295" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FF2B35" text-anchor="middle">PAID</text>

  <!-- Row 2 -->
  <text x="240" y="345" font-family="sans-serif" font-size="14" fill="#FFFFFF">#INV-9022</text>
  <text x="360" y="345" font-family="sans-serif" font-size="14" fill="#A3A3A3">Stark Tech</text>
  <text x="520" y="345" font-family="sans-serif" font-size="14" fill="#FFFFFF">$12,800.00</text>
  <rect x="660" y="330" width="70" height="22" rx="11" fill="rgba(229, 9, 20, 0.2)" stroke="#E50914"/>
  <text x="695" y="345" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FF2B35" text-anchor="middle">PAID</text>
</svg>
